<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Scattered emails get sorted into Urgent, Reply and Done trays while a calendar falls into place" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Chaos to calm: a messy inbox gets sorted and organized</title>
  <style>
    text{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;fill:#3D2C24}
    .mv,.badge,.cal,.cell,.chk,.star{transform-box:fill-box;transform-origin:center}
    .mv{animation:fly 2.8s var(--d) both}
    .badge{animation:ping 2.8s var(--d) both}
    .tray{animation:rise .6s .7s both}
    .cal{animation:calIn .7s 3.05s cubic-bezier(.3,1.4,.5,1) both}
    .cell{animation:pop .45s var(--d) cubic-bezier(.3,1.6,.5,1) both}
    .chk{animation:pop .45s var(--d) cubic-bezier(.3,1.6,.5,1) both}
    .star{animation:spark .6s var(--d) both}
    @keyframes fly{
      0%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}
      12%{transform:translate(calc(var(--dx) + 10px),calc(var(--dy) - 8px)) rotate(calc(var(--r) + 7deg))}
      26%{transform:translate(calc(var(--dx) - 8px),calc(var(--dy) + 7px)) rotate(calc(var(--r) - 6deg))}
      40%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));animation-timing-function:cubic-bezier(.3,1.25,.5,1)}
      100%{transform:translate(0,0) rotate(0)}
    }
    @keyframes ping{
      0%,20%,40%,60%{transform:scale(1)}
      10%,30%,50%{transform:scale(1.3)}
      80%{transform:scale(1)}
      92%,100%{transform:scale(0)}
    }
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes calIn{from{opacity:0;transform:translateY(-24px) scale(.85)}to{opacity:1;transform:none}}
    @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
    @keyframes spark{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:scale(1) rotate(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.badge{display:none}}
  </style>
  <defs>
    <g id="env">
      <rect width="64" height="44" rx="9" fill="currentColor" stroke="#3D2C24" stroke-opacity=".35" stroke-width="2"/>
      <path d="M5 7 32 28 59 7" fill="none" stroke="#3D2C24" stroke-opacity=".35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="tick"><circle r="11" fill="#FFFDF9" stroke="#3D2C24" stroke-opacity=".25" stroke-width="2"/><path d="M-5 0 -1.5 4 5.5 -4" fill="none" stroke="#4F8F73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <path id="spk" d="M0-9 2.5-2.5 9 0 2.5 2.5 0 9-2.5 2.5-9 0-2.5-2.5Z" fill="#F2CC8F"/>
  </defs>

  <rect x="8" y="8" width="624" height="404" rx="56" fill="#F4E9DC"/>
  <circle cx="72" cy="76" r="38" fill="#FFFDF9" opacity=".55"/>
  <circle cx="584" cy="190" r="26" fill="#E9C5B6" opacity=".5"/>

  <g class="tray">
    <rect x="45" y="258" width="150" height="112" rx="22" fill="#FBE6DE" stroke="#3D2C24" stroke-opacity=".18" stroke-width="2"/>
    <rect x="245" y="258" width="150" height="112" rx="22" fill="#E3F1E9" stroke="#3D2C24" stroke-opacity=".18" stroke-width="2"/>
    <rect x="445" y="258" width="150" height="112" rx="22" fill="#F3EADD" stroke="#3D2C24" stroke-opacity=".18" stroke-width="2"/>
  </g>

  <g transform="translate(72 266)"><g class="mv" style="--dx:328px;--dy:-196px;--r:-24deg;--d:0s"><use href="#env" style="color:#F8CBBB"/><g class="badge"><circle cx="58" cy="4" r="9" fill="#E07A5F"/><text x="58" y="8.5" font-size="12" text-anchor="middle" style="fill:#fff">!</text></g></g></g>
  <g transform="translate(104 256)"><g class="mv" style="--dx:46px;--dy:-146px;--r:16deg;--d:.1s"><use href="#env" style="color:#F8CBBB"/><g class="badge"><circle cx="58" cy="4" r="9" fill="#E07A5F"/><text x="58" y="8.5" font-size="12" text-anchor="middle" style="fill:#fff">!</text></g></g></g>
  <g transform="translate(272 266)"><g class="mv" style="--dx:248px;--dy:-116px;--r:28deg;--d:.2s"><use href="#env" style="color:#CFE6D9"/><g class="badge"><circle cx="58" cy="4" r="9" fill="#E07A5F"/><text x="58" y="8.5" font-size="12" text-anchor="middle" style="fill:#fff">!</text></g></g></g>
  <g transform="translate(304 256)"><g class="mv" style="--dx:-224px;--dy:-66px;--r:-12deg;--d:.3s"><use href="#env" style="color:#CFE6D9"/><g class="badge"><circle cx="58" cy="4" r="9" fill="#E07A5F"/><text x="58" y="8.5" font-size="12" text-anchor="middle" style="fill:#fff">!</text></g></g></g>
  <g transform="translate(472 266)"><g class="mv" style="--dx:-222px;--dy:-206px;--r:-30deg;--d:.15s"><use href="#env" style="color:#EBDFCB"/><g class="badge"><circle cx="58" cy="4" r="9" fill="#E07A5F"/><text x="58" y="8.5" font-size="12" text-anchor="middle" style="fill:#fff">!</text></g></g></g>
  <g transform="translate(504 256)"><g class="mv" style="--dx:-174px;--dy:-86px;--r:10deg;--d:.25s"><use href="#env" style="color:#EBDFCB"/><g class="badge"><circle cx="58" cy="4" r="9" fill="#E07A5F"/><text x="58" y="8.5" font-size="12" text-anchor="middle" style="fill:#fff">!</text></g></g></g>

  <g class="tray">
    <rect x="45" y="296" width="150" height="74" rx="20" fill="#F0A48D" stroke="#3D2C24" stroke-opacity=".18" stroke-width="2"/>
    <rect x="245" y="296" width="150" height="74" rx="20" fill="#A9D1BC" stroke="#3D2C24" stroke-opacity=".18" stroke-width="2"/>
    <rect x="445" y="296" width="150" height="74" rx="20" fill="#D8C5AC" stroke="#3D2C24" stroke-opacity=".18" stroke-width="2"/>
    <text x="108" y="339" font-size="17" text-anchor="middle">Urgent</text>
    <text x="308" y="339" font-size="17" text-anchor="middle">Reply</text>
    <text x="508" y="339" font-size="17" text-anchor="middle">Done</text>
  </g>

  <g transform="translate(166 334)"><g class="chk" style="--d:3.9s"><use href="#tick"/></g></g>
  <g transform="translate(366 334)"><g class="chk" style="--d:4.1s"><use href="#tick"/></g></g>
  <g transform="translate(566 334)"><g class="chk" style="--d:4.3s"><use href="#tick"/></g></g>

  <g class="cal">
    <rect x="250" y="40" width="140" height="124" rx="18" fill="#FFFDF9" stroke="#3D2C24" stroke-opacity=".18" stroke-width="2"/>
    <path d="M268 40h104a18 18 0 0 1 18 18v10H250V58a18 18 0 0 1 18-18z" fill="#E07A5F"/>
    <rect x="282" y="31" width="8" height="18" rx="4" fill="#3D2C24"/>
    <rect x="350" y="31" width="8" height="18" rx="4" fill="#3D2C24"/>
    <g fill="#EFE3D2">
      <rect x="266" y="82" width="18" height="16" rx="5"/><rect x="290" y="82" width="18" height="16" rx="5"/><rect x="314" y="82" width="18" height="16" rx="5"/><rect x="338" y="82" width="18" height="16" rx="5"/><rect x="362" y="82" width="18" height="16" rx="5"/>
      <rect x="266" y="104" width="18" height="16" rx="5"/><rect x="290" y="104" width="18" height="16" rx="5"/><rect x="314" y="104" width="18" height="16" rx="5"/><rect x="362" y="104" width="18" height="16" rx="5"/>
      <rect x="266" y="126" width="18" height="16" rx="5"/><rect x="290" y="126" width="18" height="16" rx="5"/><rect x="338" y="126" width="18" height="16" rx="5"/><rect x="362" y="126" width="18" height="16" rx="5"/>
    </g>
    <g fill="#81B29A">
      <rect class="cell" style="--d:3.7s" x="290" y="82" width="18" height="16" rx="5"/>
      <rect class="cell" style="--d:3.9s" x="338" y="104" width="18" height="16" rx="5"/>
      <rect class="cell" style="--d:4.1s" x="314" y="126" width="18" height="16" rx="5"/>
    </g>
  </g>

  <g transform="translate(222 62)"><use class="star" style="--d:4.3s" href="#spk"/></g>
  <g transform="translate(424 98) scale(.8)"><use class="star" style="--d:4.45s" href="#spk"/></g>
  <g transform="translate(410 42) scale(.6)"><use class="star" style="--d:4.6s" href="#spk"/></g>
</svg>
